[project]
name = "assistant"
version = "0.1.0"
description = "Personal assistant agent — MCP-based, gated, audited."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
assistant = "assistant.__main__:main"
assistant-nightly = "assistant.nightly:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]
