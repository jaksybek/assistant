# Render blueprint: a nightly sweep on a stateless container.
#
# There is no persistent disk here by design — the agent's state lives in a
# private git repository (see cron.py), so the container is disposable and
# every sweep leaves a reviewable diff.
#
# Every secret is marked sync:false: Render will prompt for it once in the
# dashboard rather than reading it from this file, so nothing sensitive is
# committed to a public repo.

services:
  - type: cron
    name: assistant-nightly
    runtime: python
    plan: starter
    # 04:00 UTC. Render schedules in UTC — adjust for your timezone.
    schedule: "0 4 * * *"
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run assistant-cron
    envVars:
      # Claude
      - key: ANTHROPIC_API_KEY
        sync: false
      # Mailbox (read-only IMAP)
      - key: MAIL_IMAP_HOST
        value: imap.gmail.com
      - key: MAIL_IMAP_USER
        sync: false
      - key: MAIL_IMAP_PASSWORD
        sync: false
      - key: MAIL_IMAP_FOLDER
        value: "[Gmail]/All Mail"
      # Where the briefing is sent
      - key: MAIL_DIGEST_TO
        sync: false
      # Private state repo: notes, audit log, pending approvals
      - key: ASSISTANT_STATE_REPO
        sync: false
      - key: ASSISTANT_STATE_TOKEN
        sync: false
      - key: ASSISTANT_STATE_DIR
        value: /tmp/assistant-state
      # Mirror of the personal-sessions folder, for outside agents to read.
      # Absent means no mirror — not an error. Declared only on the nightly
      # job: the approvals job never writes notes, so it has nothing to mirror.
      - key: ASSISTANT_SESSIONS_REPO
        sync: false
      - key: ASSISTANT_SESSIONS_TOKEN
        sync: false
      - key: ASSISTANT_SHARE_DIR
        value: /tmp/assistant-sessions
      # Nobody is watching: gated actions queue instead of blocking
      - key: ASSISTANT_MODE
        value: autonomous
      # Approvals channel. Optional — leave the token unset and queued actions
      # simply wait in the file instead of arriving on a phone.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Voice recordings, read-only. A service account sees only what is shared
      # with it, so the boundary is a Google sharing setting rather than code.
      # Leave either unset and the Drive server simply never starts.
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      # Calendar. Needed here for the briefing to open with the day: the
      # server registers only when the refresh token is present, so a job
      # missing these credentials silently has no calendar tools and the
      # schedule section is never added — a briefing that looks complete and
      # is not. The same three are on the other job, for approved writes and
      # for reminders.
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN
        sync: false
      # Optional; leave unset to use the account's primary calendar. If you set
      # it, set it on BOTH jobs, or they read different calendars.
      - key: GOOGLE_CALENDAR_ID
        sync: false

  # The chat half. Two jobs in one, because both read the same Telegram offset
  # and polling it twice would have each confirm receipt of the other's updates:
  #
  #   * the other end of the approval loop — the sweep above exits as soon as it
  #     is done, so nothing is listening when a button is finally pressed;
  #   * instructions typed (or dictated) into the chat, run as prompts, answered
  #     back in the same chat.
  #
  # The interval IS the responsiveness. At 15 minutes an approval lands fine and
  # a question does not: a reply a quarter of an hour later is not a
  # conversation. Two minutes is the compromise — still a cron, no always-on
  # service to pay for, and each idle run is a container start, a git fetch and
  # one HTTP call. Raise it if the container minutes are not worth it; drop to a
  # webhook web service if you want it instant.
  #
  # NOTE: Render does not re-sync a blueprint after the first deploy. Changing
  # this line does NOT change the live schedule — edit it in the dashboard.
  - type: cron
    name: assistant-approvals
    runtime: python
    plan: starter
    schedule: "*/2 * * * *"
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run assistant-approve
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # An approved action runs through the same MCP servers as the sweep, so
      # the mail server needs its credentials to start alongside the notes one.
      - key: MAIL_IMAP_HOST
        value: imap.gmail.com
      - key: MAIL_IMAP_USER
        sync: false
      - key: MAIL_IMAP_PASSWORD
        sync: false
      - key: MAIL_IMAP_FOLDER
        value: "[Gmail]/All Mail"
      - key: ASSISTANT_STATE_REPO
        sync: false
      - key: ASSISTANT_STATE_TOKEN
        sync: false
      - key: ASSISTANT_STATE_DIR
        value: /tmp/assistant-state
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Voice recordings, read-only. A service account sees only what is shared
      # with it, so the boundary is a Google sharing setting rather than code.
      # Leave either unset and the Drive server simply never starts.
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      # Calendar. Needed here as well as on the sweep, for two reasons: an
      # approved create/reschedule/cancel runs through the same MCP servers, so
      # without these the calendar server never starts and the approved action
      # fails at the moment it is least expected — and meeting reminders run on
      # this job, because it already wakes on the interval a reminder needs.
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN
        sync: false
      # Which calendar. Optional, but it must match the sweep's: _config()
      # silently falls back to "primary", so a non-primary calendar set on one
      # job and not the other means reminders read the wrong calendar and an
      # approved reschedule cannot find the event it was approved for.
      - key: GOOGLE_CALENDAR_ID
        sync: false
      # How long before a meeting the nudge arrives. MUST be longer than this
      # job's interval, or an event can start between two runs and be missed.
      # Set to 0 to switch reminders off.
      - key: ASSISTANT_REMINDER_MINUTES
        value: "20"
